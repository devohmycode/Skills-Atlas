name: crawl

on:
  schedule:
    # Every other day at 04:17 UTC (odd days of the month; the 31st and the 1st
    # run back to back). Minutes are free on public repositories, but each run
    # (~24 min) still shows on the account's Actions usage meter, shared with
    # private repositories on a 2,000-minute plan.
    - cron: '17 4 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Crawl every source
        # skills.sh install counts for the 600 most popular owners (~21 min at 30 req/min).
        run: npm run crawl -- --max-owners 600
        env:
          # Optional: full skills.sh leaderboard through the authenticated API.
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          # Trees API quota (1 000 req/h in Actions) to locate SKILL.md files for descriptions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild the web demo from the new snapshot
        run: npm run demo
      - name: Commit the new snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json.gz docs/demo/index.html
          if git diff --cached --quiet; then
            echo 'catalog unchanged'
          else
            git commit -m "chore(catalog): refresh snapshot $(date -u +%F)"
            git push
          fi
