name: completion

# The completion scripts run inside shells no unit test starts: check each one for real.
on:
  pull_request:
    paths: ['src/completion.ts', 'src/cli.tsx', 'scripts/check-completion.sh', '.github/workflows/completion.yml']
  push:
    branches: [main]
    paths: ['src/completion.ts', 'src/cli.tsx', 'scripts/check-completion.sh', '.github/workflows/completion.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shells:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # bash and PowerShell come with the runner image.
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish
      - run: npm ci && npm run build && npm link
      - name: Shell versions
        run: |
          bash --version | head -1
          zsh --version
          fish --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: bash scripts/check-completion.sh
